name: Build Christmas Dream Launcher APKs
on:
  push:
    branches: [ main, feature/home-cards-ice-clock-jingle ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install orchestral music renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fluidsynth timgm6mb-soundfont ffmpeg
          python -m pip install --user pretty_midi
      - name: Render three-minute orchestral Jingle Bells
        run: |
          python tools/build_jingle.py
          mkdir -p app/src/main/res/raw
          fluidsynth -ni -g 0.42 -r 44100 -F /tmp/jingle_bells.wav /usr/share/sounds/sf2/TimGM6mb.sf2 build/music/jingle_bells.mid
          ffmpeg -y -i /tmp/jingle_bells.wav -t 181 -af "loudnorm=I=-20:TP=-3:LRA=8,afade=t=in:st=0:d=2,afade=t=out:st=177:d=4" -codec:a libmp3lame -b:a 96k -ar 44100 -ac 2 app/src/main/res/raw/jingle_bells.mp3
          test -s app/src/main/res/raw/jingle_bells.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 app/src/main/res/raw/jingle_bells.mp3
      - name: Add full-scene Christmas artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -fL --retry 3 "https://images.unsplash.com/vector-1763266642939-0428c7297e25?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=90&w=1800&h=2400" -o app/src/main/res/drawable-nodpi/christmas_background_phone.jpg
          curl -fL --retry 3 "https://images.unsplash.com/vector-1763266642939-0428c7297e25?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=90&w=2400&h=1350" -o app/src/main/res/drawable-nodpi/christmas_background_tv.jpg
          curl -fL --retry 3 "https://images.pexels.com/photos/29615964/pexels-photo-29615964.jpeg?auto=compress&cs=tinysrgb&w=1400" -o app/src/main/res/drawable-nodpi/christmas_tree_feature.jpg
          file app/src/main/res/drawable-nodpi/christmas_background_*.jpg app/src/main/res/drawable-nodpi/christmas_tree_feature.jpg
      - name: Build phone and TV variants
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Christmas-Dream-Launcher-phone
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Christmas-Dream-Launcher-TV
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 14
