name: Build Ramadan Dream Launcher APKs
on:
  push:
    branches: [ ramadan-islamic-launcher ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download openly licensed adhan audio (CC0)
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Adhan.ogg" -o app/src/main/res/raw/adhan.ogg
          file app/src/main/res/raw/adhan.ogg
      - name: Download Ramadan nasheed audio (Pixabay Content License)
        run: |
          mkdir -p app/src/main/res/raw
          python - <<'PY'
          import re, urllib.request, html
          page = "https://pixabay.com/music/world-ramadhan-islamic-nasheed-307885/"
          request = urllib.request.Request(page, headers={"User-Agent": "Mozilla/5.0"})
          source = urllib.request.urlopen(request, timeout=30).read().decode("utf-8", "ignore")
          source = source.replace("\\/", "/").replace("&amp;", "&")
          matches = re.findall(r'https?://cdn\.pixabay\\.com/audio/[^"\\\\ <>]+?\.mp3(?:\?[^"\\ <>]*)?', source)
          if not matches:
              matches = re.findall(r'//cdn\.pixabay\\.com/audio/[^"\\\\ <>]+?\.mp3(?:\?[^"\\ <>]*)?', source)
          if not matches:
              raise SystemExit("Could not locate the official Pixabay MP3 asset in the track page")
          audio_url = html.unescape(matches[0])
          if audio_url.startswith("//"):
              audio_url = "https:" + audio_url
          req = urllib.request.Request(audio_url, headers={"User-Agent": "Mozilla/5.0", "Referer": page})
          data = urllib.request.urlopen(req, timeout=60).read()
          is_mp3 = data[:3] == b"ID3" or (len(data) > 1 and data[0] == 0xFF and (data[1] & 0xE0) == 0xE0)
          if len(data) < 10000 or not is_mp3:
              raise SystemExit("Downloaded nasheed audio did not pass MP3 validation")
          open("app/src/main/res/raw/nasheed.mp3", "wb").write(data)
          print("Downloaded Ramadan nasheed:", len(data), "bytes")
          PY
      - name: Build phone and TV variants
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Dream-Launcher-phone
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Dream-Launcher-TV
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 14
