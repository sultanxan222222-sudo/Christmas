name: Build Ramadan Dream Launcher APKs
on:
  push:
    branches: [ ramadan-islamic-launcher ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download openly licensed adhan audio (CC0)
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Adhan.ogg" -o app/src/main/res/raw/adhan.ogg
          file app/src/main/res/raw/adhan.ogg
      - name: Download and prepare vocal nasheed (CC BY 3.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Jawad_Syed_-_Alhamdulilah_(Vocal_Only_Nasheed).flac" -o /tmp/ramadan_nasheed.flac
          ffmpeg -y -i /tmp/ramadan_nasheed.flac -af "volume=0.55,afade=t=in:st=0:d=2,afade=t=out:st=185:d=5" -codec:a libmp3lame -b:a 96k -ar 44100 -ac 2 app/src/main/res/raw/nasheed.mp3
          test -s app/src/main/res/raw/nasheed.mp3
          file app/src/main/res/raw/nasheed.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 app/src/main/res/raw/adhan.ogg
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 app/src/main/res/raw/nasheed.mp3
          test -s app/src/main/res/raw/adhan.ogg
          test -s app/src/main/res/raw/nasheed.mp3
      - name: Verify the full animated 3D scene is present
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          p = Path("app/src/main/assets/models/ramadan_dream_scene.glb")
          data = p.read_bytes()
          assert data[:4] == b"glTF", "Missing Ramadan 3D scene"
          version, length = struct.unpack_from("<II", data, 4)
          assert version == 2 and length == len(data), "Invalid scene GLB header"
          chunk_len, chunk_type = struct.unpack_from("<II", data, 12)
          assert chunk_type == 0x4E4F534A, "Missing glTF JSON chunk"
          gltf = json.loads(data[20:20+chunk_len].decode("utf-8").rstrip(" \\t\\r\\n\\0"))
          assert len(gltf.get("meshes", [])) >= 100, "3D scene geometry or 3D starlight is incomplete"
          assert len(gltf.get("animations", [])) >= 10, "Synchronized 3D scene animation clips are missing"
          print("3D scene OK:", len(gltf["meshes"]), "meshes,", len(gltf.get("materials", [])), "materials,", len(gltf["animations"]), "animations")
          PY
      - name: Build phone and TV variants
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug
      - name: Verify both APKs contain playable audio resources
        run: |
          for apk in app/build/outputs/apk/phone/debug/app-phone-debug.apk app/build/outputs/apk/tv/debug/app-tv-debug.apk; do
            test -s "$apk"
            unzip -l "$apk" | grep -q "res/raw/adhan.ogg"
            unzip -l "$apk" | grep -q "res/raw/nasheed.mp3"
            unzip -l "$apk" | grep -q "assets/models/ramadan_dream_scene.glb"
          done
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Dream-Launcher-phone
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Dream-Launcher-TV
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 14
